# Render blueprint — deploys the FastAPI backend as a web service.
# The frontend is deployed separately to Vercel (see vercel.json + docs/deployment.md).
services:
  - type: web
    name: api-monitoring-backend
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.0
      - key: ENVIRONMENT
        value: production   # enables fail-fast guards (refuses default JWT secret)
      - key: MONGODB_URI
        sync: false        # set in the Render dashboard (Atlas connection string); stored as a secret
      - key: DATABASE_NAME
        value: api_monitoring
      - key: JWT_SECRET
        generateValue: true  # Render generates a random secret; regenerate/rotate in production
      - key: JWT_ALGORITHM
        value: HS256
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: "60"
      - key: FRONTEND_URL
        sync: false        # set to your Vercel frontend URL, e.g. https://your-app.vercel.app
      - key: MONITOR_DEFAULT_INTERVAL
        value: "300"
      - key: MONITOR_DEFAULT_TIMEOUT
        value: "10"
      - key: FAILURE_THRESHOLD
        value: "3"
      - key: RECOVERY_THRESHOLD
        value: "2"
      - key: MONITOR_ALLOW_LOOPBACK
        value: "false"      # loopback targets are blocked in production
      - key: RESULTS_RETENTION_DAYS
        value: "30"
      - key: DEGRADED_LATENCY_MS
        value: "1000"
      # Optional email alerts — leave unset to disable:
      # - key: SMTP_HOST
      #   sync: false
      # - key: SMTP_PORT
      #   value: "587"
      # - key: SMTP_USERNAME
      #   sync: false
      # - key: SMTP_PASSWORD
      #   sync: false
      # - key: SMTP_FROM
      #   sync: false
